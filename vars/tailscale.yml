---
# artis3n.tailscale configuration
# https://github.com/artis3n/ansible-role-tailscale

# Auth key for joining the tailnet. The pinned role requires it on every normal
# run, including hosts that are already enrolled. Set tailscale_up_skip to true
# only for runs that intentionally skip `tailscale up`.
# Generate a reusable/ephemeral auth key at https://login.tailscale.com/admin/settings/keys
# and add it to the Semaphore project variable group as the secret environment
# variable `TAILSCALE_AUTHKEY`. Do not store the key in this repository.
tailscale_authkey: >-
  {{
    lookup(
      'ansible.builtin.env',
      'TAILSCALE_AUTHKEY',
      default=undef()
    )
  }}

# Additional tailscale up arguments (e.g. "--advertise-exit-node", "--ssh")
# Use "--force-reauth" here only for deliberate reauthentication.
tailscale_args: ""

# Tailscale package versions are managed by the third-party collection.
