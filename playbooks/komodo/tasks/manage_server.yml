---
- name: Ensure OpenSSL is installed
  become: true
  ansible.builtin.package:
    name: openssl
    state: present

- name: Derive the Periphery public key
  become: true
  check_mode: false
  changed_when: false
  no_log: true
  ansible.builtin.command:
    argv:
      - openssl
      - pkey
      - -in
      - "{{ komodo_root_directory }}/keys/periphery.key"
      - -pubout
  register: _komodo_periphery_public_key_pem

- name: Normalize the Periphery public key
  ansible.builtin.set_fact:
    _komodo_periphery_public_key: >-
      {{
        _komodo_periphery_public_key_pem.stdout_lines
        | map('trim')
        | reject('match', '^-----')
        | reject('equalto', '')
        | join('')
      }}
    _komodo_managed_server_name: "{{ server_name | default(inventory_hostname) }}"
  changed_when: false

- name: Validate the Periphery public key
  ansible.builtin.assert:
    that:
      - _komodo_periphery_public_key | length > 0
      - _komodo_periphery_public_key is match('^[A-Za-z0-9+/]+={0,2}$')
    quiet: true
    fail_msg: Failed to derive the Periphery public key

- name: Read the Komodo Core server record
  delegate_to: "{{ komodo_api_delegate_to }}"
  become: false
  check_mode: false
  changed_when: false
  no_log: true
  ansible.builtin.uri:
    url: "{{ komodo_core_http_address | trim('/') }}/read"
    method: POST
    headers:
      X-Api-Key: "{{ komodo_core_api_key }}"
      X-Api-Secret: "{{ komodo_core_api_secret }}"
    body_format: json
    body:
      type: GetServer
      params:
        server: "{{ _komodo_managed_server_name }}"
    status_code: [200, 500]
    return_content: true
  register: _komodo_server_probe
  retries: 2
  delay: 5

- name: Compare the Komodo Core server record
  when: _komodo_server_probe.status == 200
  ansible.builtin.set_fact:
    _komodo_server_key_changed: >-
      {{
        (_komodo_server_probe.json.info.public_key | default(''))
        != _komodo_periphery_public_key
      }}
    _komodo_server_config_changed: >-
      {{
        (_komodo_server_probe.json.config.address | default(''))
        != server_address
        or not (_komodo_server_probe.json.config.enabled | default(false) | bool)
      }}
  changed_when: false

- name: Update the Komodo Core server public key
  when:
    - not ansible_check_mode
    - _komodo_server_probe.status == 200
    - _komodo_server_key_changed | bool
  delegate_to: "{{ komodo_api_delegate_to }}"
  become: false
  changed_when: true
  no_log: true
  ansible.builtin.uri:
    url: "{{ komodo_core_http_address | trim('/') }}/write"
    method: POST
    headers:
      X-Api-Key: "{{ komodo_core_api_key }}"
      X-Api-Secret: "{{ komodo_core_api_secret }}"
    body_format: json
    body:
      type: UpdateServerPublicKey
      params:
        server: "{{ _komodo_managed_server_name }}"
        public_key: "{{ _komodo_periphery_public_key }}"
    status_code: 200
    return_content: true
  retries: 2
  delay: 5

- name: Update the Komodo Core server configuration
  when:
    - not ansible_check_mode
    - _komodo_server_probe.status == 200
    - _komodo_server_key_changed | bool or _komodo_server_config_changed | bool
  delegate_to: "{{ komodo_api_delegate_to }}"
  become: false
  changed_when: true
  no_log: true
  ansible.builtin.uri:
    url: "{{ komodo_core_http_address | trim('/') }}/write"
    method: POST
    headers:
      X-Api-Key: "{{ komodo_core_api_key }}"
      X-Api-Secret: "{{ komodo_core_api_secret }}"
    body_format: json
    body:
      type: UpdateServer
      params:
        id: "{{ _komodo_managed_server_name }}"
        config:
          address: "{{ server_address }}"
          enabled: true
    status_code: 200
    return_content: true
  retries: 2
  delay: 5

- name: Create the Komodo Core server
  when:
    - not ansible_check_mode
    - _komodo_server_probe.status == 500
  delegate_to: "{{ komodo_api_delegate_to }}"
  become: false
  changed_when: true
  no_log: true
  ansible.builtin.uri:
    url: "{{ komodo_core_http_address | trim('/') }}/write"
    method: POST
    headers:
      X-Api-Key: "{{ komodo_core_api_key }}"
      X-Api-Secret: "{{ komodo_core_api_secret }}"
    body_format: json
    body:
      type: CreateServer
      params:
        name: "{{ _komodo_managed_server_name }}"
        config:
          address: "{{ server_address }}"
          enabled: true
        public_key: "{{ _komodo_periphery_public_key }}"
    status_code: 200
    return_content: true
  retries: 2
  delay: 5
