---
- name: Manage Komodo Service
  hosts: komodo
  tags: [komodo]
  become: false

  pre_tasks:
    - name: Validate inbound-only Komodo mode
      ansible.builtin.assert:
        that:
          - komodo_server_enabled | bool
          - komodo_core_address | default('') | string | trim | length == 0
          - komodo_onboarding_key | default('') | string | trim | length == 0
          - >-
            (
              komodo_extra_env | default([])
              | selectattr('name', 'defined')
              | map(attribute='name')
              | intersect(_komodo_outbound_environment_names)
              | list
              | length
            ) == 0
        quiet: true
        fail_msg: Outbound Komodo variables conflict with inbound-only mode
      vars:
        _komodo_outbound_environment_names:
          - PERIPHERY_CORE_ADDRESS
          - PERIPHERY_CORE_ADDRESSES
          - PERIPHERY_CONNECT_AS
          - PERIPHERY_ONBOARDING_KEY
          - PERIPHERY_ONBOARDING_KEY_FILE
      tags: [komodo]

    - name: Validate Semaphore Komodo variables
      ansible.builtin.assert:
        that:
          - public_domain is defined
          - public_domain | length > 0
          - public_domain is match('^[A-Za-z0-9.-]+$')
          - komodo_core_public_key is defined
          - komodo_core_public_key | length > 0
          - komodo_core_api_key is defined
          - komodo_core_api_key | length > 0
          - komodo_core_api_secret is defined
          - komodo_core_api_secret | length > 0
          - komodo_registry_providers[0].accounts[0].username is defined
          - komodo_registry_providers[0].accounts[0].username | length > 0
          - komodo_registry_providers[0].accounts[0].token is defined
          - komodo_registry_providers[0].accounts[0].token | length > 0
        quiet: true
        fail_msg: Required Komodo variables are missing from Semaphore
      no_log: true
      tags: [komodo]

  roles:
    - role: bpbradley.komodo
      tags: [komodo]
