---
- name: Base config for everything
  hosts: all
  roles:
    - role: hifis.unattended_upgrades
      tags: [base, upgrades]
      when: inventory_hostname not in groups.get('pve', [])
    - role: journald_retention
      tags: [base, journald]
    - role: zsh
      tags: [base, zsh]

- name: Komodo hosts
  hosts: komodo
  tags: [komodo]
  pre_tasks:
    - name: Validate explicit IPv6 forwarding interface
      ansible.builtin.assert:
        that:
          - >-
            komodo_ipv6_interface is not defined or
            (
              komodo_ipv6_interface is string and
              komodo_ipv6_interface is match('^[A-Za-z0-9_.-]{1,15}$') and
              not komodo_ipv6_interface is search('[\r\n]') and
              komodo_ipv6_interface in ansible_facts.get('interfaces', [])
            )
        quiet: true
        fail_msg: >-
          komodo_ipv6_interface must be a Linux interface name containing only
          letters, digits, dots, underscores, or hyphens and present in
          Ansible's discovered interface facts.
      tags: [networking, sysctl]

    - name: Select IPv6 forwarding interface
      ansible.builtin.set_fact:
        _komodo_ipv6_interface: >-
          {{
            komodo_ipv6_interface | default('')
            or ansible_facts.get('default_ipv6', {}).get('interface', '')
            or ansible_facts.get('default_ipv4', {}).get('interface', '')
          }}
      tags: [networking, sysctl]

    - name: Validate IPv6 forwarding interface
      ansible.builtin.assert:
        that:
          - _komodo_ipv6_interface is string
          - >-
            (_komodo_ipv6_interface | string)
            is match('^[A-Za-z0-9_.-]{1,15}$')
          - not (_komodo_ipv6_interface | string) is search('[\r\n]')
          - _komodo_ipv6_interface in ansible_facts.get('interfaces', [])
        quiet: true
        fail_msg: >-
          No safe IPv6 forwarding interface was found. Set komodo_ipv6_interface
          to a Linux interface name containing only letters, digits, dots,
          underscores, or hyphens.
      tags: [networking, sysctl]

    - name: Build IPv6 forwarding sysctl settings with selected interface
      ansible.builtin.set_fact:
        _komodo_sysctl:
          net.ipv6.conf.all.forwarding: "1"
          net.ipv6.conf.all.accept_ra: "2"
          net.ipv6.conf.default.accept_ra: "2"
          "net/ipv6/conf/{{ _komodo_ipv6_interface }}/accept_ra": "2"
      tags: [networking, sysctl]
  roles:
    - role: geerlingguy.docker
      tags: [docker]
      vars:
        docker_daemon_options:
          live-restore: true
          storage-driver: "overlay2"
          ipv6: true
    - role: sysctl
      tags: [networking, sysctl]
      vars:
        sysctl_settings: "{{ _komodo_sysctl }}"
        sysctl_drop_in_file: "/etc/sysctl.d/99-ipv6-forwarding.conf"

- name: Proxmox hosts
  hosts: pve
  tags: [pve]
  roles:
    - role: sysctl
      tags: [sysctl]
      vars:
        sysctl_settings: "{{ pve_sysctl_settings }}"
        sysctl_drop_in_file: "{{ pve_sysctl_drop_in_file }}"
    - role: zram
      tags: [zram]
    - role: brianhartsock.smartmontools
      tags: [smart]
    - role: vzdump
      tags: [vzdump]
    - role: pve_host_backup
      tags: [host_backup]
    - role: pve_update_policy
      tags: [updates]
    - role: pve_peer_reboot
      tags: [reboot]
  vars:
    smartmon_configuration_lines:
      - >-
        DEVICESCAN -a -o on -S on -n standby,10,q -m root
        -M exec /usr/share/smartmontools/smartd-runner
        -M test -s (S/../.././03|L/../../7/04)

- name: Machines
  hosts: machines
  tags: [machines]
  roles:
    - role: sysctl
      tags: [networking, sysctl]
      vars:
        sysctl_settings: "{{ machines_sysctl_settings }}"
        sysctl_drop_in_file: "{{ machines_sysctl_drop_in_file }}"
        sysctl_modules: "{{ machines_sysctl_modules }}"

- name: Backup hosts
  hosts: backup
  tags: [backup]
  roles:
    - role: github_release_download
      tags: [curl]
  vars:
    github_release_download_repo: "moparisthebest/static-curl"
    github_release_download_asset: "curl-amd64"
    github_release_download_version: "v8.21.0"
    github_release_download_checksum: "sha256:e45ae1805ceb3f816e9768fbbaba05d98a2dc9c5577f66395f37660941d88e19"
    github_release_download_dest: "/opt/docker/rustic/curl"
    github_release_download_mode: "0755"
    github_release_download_cron_enabled: true
    github_release_download_post_update_command: "docker restart rustic"
    github_release_download_debug: true
