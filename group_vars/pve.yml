---
# Sysctl settings for Proxmox hosts
# - vm.overcommit_memory=1 required for Docker/Redis in LXC containers
# - kernel.keys.* raised for Docker in LXC (default limits hit with many containers)
pve_sysctl_settings:
  vm.overcommit_memory: "1"
  kernel.keys.maxkeys: "5000"
  kernel.keys.maxbytes: "500000"

pve_sysctl_drop_in_file: "/etc/sysctl.d/99-pve.conf"

# zram compressed-swap (systemd-zram-generator). 25% of RAM, zstd, priority 100.
# ram * 0.25 auto-scales per host (~20G on the 80G node, ~16G on the 64G node);
# add `host_memory_limit` or a host_vars override to cap it.
zram_devices:
  zram0:
    zram_size: "ram * 0.25"
    compression_algorithm: zstd
    swap_priority: 100
zram_swappiness: 10

vzdump_extra_exclude_paths:
  - /opt/docker/birdnet/data/clips

# PVE package installation is performed only by pve_maintenance. Package-index
# refresh remains enabled, while the base APT install-mode timer, automatic
# package downloads, and autoclean stay off.

# Explicit maintenance policy. The first controlled update is europa, then io.
pve_maintenance_execute: false
# Validated on 2026-08-14 on the current jupiter europa/io cluster: atomic
# mkdir, second-mkdir failure, and empty rmdir succeeded on the pmxcfs lock.
pve_maintenance_pmxcfs_atomic_lock_validated: true
pve_maintenance_cluster_name: jupiter
pve_maintenance_cluster_nodes:
  - europa
  - io

# The peer-aware local reboot timer is intentionally disabled until the first
# controlled updates and observed reboots have been validated.
pve_peer_reboot_enabled: false
pve_peer_reboot_pmxcfs_atomic_lock_validated: true
pve_peer_reboot_cluster_name: jupiter
pve_peer_reboot_cluster_nodes:
  - europa
  - io
pve_peer_reboot_calendars:
  europa: "Sat *-*-* 06:30:00"
  io: "Sun *-*-* 06:30:00"
