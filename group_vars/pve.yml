---
# Sysctl settings for Proxmox hosts
# - vm.overcommit_memory=1 required for Docker/Redis in LXC containers
# - kernel.keys.* raised for Docker in LXC (default limits hit with many containers)
pve_sysctl_settings:
  vm.overcommit_memory: "1"
  kernel.keys.maxkeys: "5000"
  kernel.keys.maxbytes: "500000"

pve_sysctl_drop_in_file: "/etc/sysctl.d/99-pve.conf"

# zram compressed-swap (systemd-zram-generator). 25% of RAM, zstd, priority 100.
# ram * 0.25 auto-scales per host (~20G on the 80G node, ~16G on the 64G node);
# add `host_memory_limit` or a host_vars override to cap it.
zram_devices:
  zram0:
    zram_size: "ram * 0.25"
    compression_algorithm: zstd
    swap_priority: 100
zram_swappiness: 10

# Debian's packaged scrub helper starts every pool together. Evaluate io daily,
# but target a 28-day cycle for each discovered pool. Prefer a late scrub over
# overlapping pool scans.
pve_resource_scheduling_scrub_policies:
  io:
    calendar: "*-*-* 05:00:00"
    cycle_days: 28

# Explicit opt-in ZFS snapshot policy shared by PVE nodes. Common mappings cover
# the equivalent rpool layout on io, europa, and future nodes. Host mappings add
# only datasets unique to that node; the role itself contains no storage names.
pve_zfs_snapshot_policy_tiers:
  frequent:
    schedule: "*/15 * * * *"
    keep: 4
  hourly:
    schedule: "17 * * * *"
    keep: 24
  daily:
    schedule: "25 3 * * *"
    keep: 7
  weekly:
    schedule: "47 3 * * 0"
    keep: 4
  monthly:
    schedule: "52 3 1 * *"
    keep: 3

pve_zfs_snapshot_policy_profiles:
  disabled:
    frequent: false
    hourly: false
    daily: false
    weekly: false
    monthly: false
  host_root:
    frequent: false
    hourly: true
    daily: true
    weekly: true
    monthly: true
  guest:
    frequent: true
    hourly: true
    daily: false
    weekly: false
    monthly: false
  bulk:
    frequent: false
    hourly: false
    daily: true
    weekly: true
    monthly: false
  app:
    frequent: true
    hourly: true
    daily: true
    weekly: true
    monthly: true
  userdata:
    frequent: false
    hourly: false
    daily: true
    weekly: true
    monthly: true

pve_zfs_snapshot_policy_common_datasets:
  rpool: disabled
  rpool/ROOT: disabled
  rpool/ROOT/pve-1: host_root
  rpool/data: guest
  rpool/var-lib-vz: disabled

pve_zfs_snapshot_policy_host_datasets:
  io:
    data: bulk
    data/proxmox: disabled
    data2: bulk
    data3: bulk
    data3/appdata: disabled
    data3/appdata/birdnet: disabled
    data3/appdata/birdnet/clips: bulk
    data3/appdata/frigate: disabled
    data3/appdata/frigate/media: disabled
    data3/appdata/karakeep: disabled
    data3/appdata/karakeep/assets: app
    data3/appdata/languagetool: disabled
    data3/appdata/languagetool/ngrams: disabled
    data3/appdata/plex: disabled
    data3/appdata/plex/media: disabled
    data3/proxmox: disabled
    data3/proxmox-backup-server: disabled
    data3/userdata: disabled
    data3/userdata/game-saves: userdata
    data3/userdata/photos: userdata

# io completed candidate review, manifest-bound cleanup, and creation testing.
# Unlisted hosts, including europa, remain inactive until separately reviewed.
pve_zfs_snapshot_policy_prune_schedule: "7,22,37,56 * * * *"
pve_zfs_snapshot_policy_host_activation:
  io:
    creation_enabled: true
    prune_enabled: true
pve_zfs_snapshot_policy_prune_now: false
pve_zfs_snapshot_policy_report_prune_candidates: true

vzdump_extra_exclude_paths:
  - /opt/docker/birdnet/data/clips

# PVE package installation is performed only by pve_maintenance. Package-index
# refresh remains enabled, while the base APT install-mode timer, automatic
# package downloads, and autoclean stay off.

# Explicit maintenance policy. The first controlled update is europa, then io.
pve_maintenance_execute: false
# Validated on 2026-08-14 on the current jupiter europa/io cluster: atomic
# mkdir, second-mkdir failure, and empty rmdir succeeded on the pmxcfs lock.
pve_maintenance_pmxcfs_atomic_lock_validated: true
pve_maintenance_cluster_name: jupiter
pve_maintenance_cluster_nodes:
  - europa
  - io
# europa is physically powered off pending fan repair. Keep static cluster
# membership unchanged; io maintenance requires the exact quorate singleton
# state, and execute mode additionally requires a per-run fencing acknowledgement.
pve_maintenance_cluster_safety_mode: planned_singleton
pve_maintenance_planned_singleton_node: io
pve_maintenance_planned_singleton_peer: europa
# Validated on 2026-08-17 with static europa/io membership and exact io-only
# quorum: first mkdir succeeded, second mkdir failed, and empty rmdir succeeded.
pve_maintenance_planned_singleton_pmxcfs_atomic_lock_validated: true
pve_maintenance_planned_singleton_fencing_ack: false

# The peer-aware local reboot timer is intentionally disabled until the first
# controlled updates and observed reboots have been validated.
pve_peer_reboot_enabled: false
pve_peer_reboot_pmxcfs_atomic_lock_validated: true
pve_peer_reboot_cluster_name: jupiter
pve_peer_reboot_cluster_nodes:
  - europa
  - io
pve_peer_reboot_calendars:
  europa: "Sat *-*-* 06:30:00"
  io: "Sun *-*-* 06:30:00"
