---
name: molecule

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molecule-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Molecule (${{ matrix.role }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        role:
          - github_release_download
          - journald_retention
          - pve_host_backup
          - pve_maintenance
          - pve_peer_reboot
          - pve_resource_scheduling
          - pve_update_policy
          - sysctl
          - vzdump
          - zsh
          - zram
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tooling
        run: pip install --require-hashes --requirement requirements-dev.txt
      - name: Install Ansible requirements
        run: >-
          ansible-galaxy collection install
          --requirements-file playbooks/all-hosts/requirements.yml
      - name: Run Molecule
        working-directory: roles/${{ matrix.role }}
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
        run: |
          set -o pipefail
          if molecule test --scenario-name default 2>&1 | tee molecule.log; then
            exit 0
          fi
          details=$(tail -120 molecule.log)
          details=${details//'%'/'%25'}
          details=${details//$'\n'/'%0A'}
          details=${details//$'\r'/'%0D'}
          echo "::error title=Molecule (${{ matrix.role }})::$details"
          exit 1
