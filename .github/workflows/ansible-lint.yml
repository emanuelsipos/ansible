---
name: ansible-lint
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Ansible Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
      - name: Install development tooling
        run: pip install --requirement requirements-dev.txt
      - name: Install all requirements
        run: |
          for f in playbooks/*/requirements.yml; do
            ansible-galaxy install -r "$f"
          done
      - name: Check playbook syntax
        run: |
          for playbook in playbooks/*/playbook.yml; do
            ansible-playbook --syntax-check "$playbook"
          done
      - name: Run ansible-lint
        uses: ansible/ansible-lint@262624cd0ab22a4221293216856c59671ce7aa5e  # v26.6.0
        with:
          setup_python: "false"
      - name: Ping healthchecks
        if: success() || failure()  # not on cancellation
        env:
          HC_URL: ${{ secrets.HC_ANSIBLE_LINT }}
        run: |
          [ -z "$HC_URL" ] && exit 0
          if [ "${{ job.status }}" = "success" ]; then
            curl -fsS --retry 3 "$HC_URL" > /dev/null || true
          else
            curl -fsS --retry 3 "${HC_URL}/fail" > /dev/null || true
          fi
