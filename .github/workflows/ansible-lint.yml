---
name: ansible-lint
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 4 * * *" # Daily; keeps the 1-day Healthchecks timeout meaningful.
  workflow_dispatch:
    inputs:
      send_heartbeat:
        description: Send the production Healthchecks heartbeat.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ansible-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tooling
        run: pip install --require-hashes --requirement requirements-dev.txt
      - name: Validate development dependency lock
        run: |
          uv pip compile --generate-hashes --output-file=requirements-dev.txt requirements-dev.in
          git diff --exit-code -- requirements-dev.txt
      - name: Verify playbook variable discovery
        run: python .github/scripts/verify_playbook_layout.py
      - name: Install all requirements
        run: |
          for f in playbooks/*/requirements.yml; do
            ansible-galaxy collection install -r "$f"
            ansible-galaxy role install --roles-path ~/.ansible/roles -r "$f"
          done
      - name: Check playbook syntax
        run: |
          for playbook in playbooks/*/playbook.yml; do
            ansible-playbook --syntax-check "$playbook"
          done
      - name: Run ansible-lint
        uses: ansible/ansible-lint@665d9e07a1943254d2910faffc106adaf7ea7294  # v26.8.0
        with:
          setup_python: "false"
      - name: Ping healthchecks
        if: >-
          (success() || failure()) &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.send_heartbeat))
        env:
          HC_URL: ${{ secrets.HC_ANSIBLE_LINT }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "::error::HC_ANSIBLE_LINT is not configured; refusing to report a false heartbeat."
            exit 1
          fi
          if [ "${{ job.status }}" = "success" ]; then
            curl -A "Mozilla/5.0 (compatible; GitHub-Actions-Healthchecks/1.0)" \
              -fsS --retry 3 "$HC_URL" > /dev/null
          else
            curl -A "Mozilla/5.0 (compatible; GitHub-Actions-Healthchecks/1.0)" \
              -fsS --retry 3 "${HC_URL}/fail" > /dev/null
          fi
