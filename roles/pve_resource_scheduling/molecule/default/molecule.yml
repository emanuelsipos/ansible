---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: io
    image: geerlingguy/docker-debian12-ansible@sha256:e365f7f43a95b8bd31b4ed25da1a4e3a5ae576151c4df67cf51776e696644e4e
    pre_build_image: true
    pull: true
    privileged: true
    cgroupns_mode: host
    command: >-
      /bin/sh -c 'if ! mountpoint -q /proc/sys/fs/binfmt_misc; then
      mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc; fi &&
      mount --bind /proc/sys/fs/binfmt_misc/status
      /proc/sys/fs/binfmt_misc/status &&
      mount -o remount,bind,ro /proc/sys/fs/binfmt_misc/status &&
      exec /lib/systemd/systemd'
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
verifier:
  name: ansible
