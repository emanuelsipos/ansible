---
- name: Install zram-generator
  ansible.builtin.apt:
    name: "{{ zram_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: zram_package_result
  tags: [zram]

- name: Detect container environment (zram-generator is a no-op in containers)
  ansible.builtin.command: systemd-detect-virt --container --quiet
  register: _zram_container_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [zram]

- name: Load zram kernel module
  community.general.modprobe:
    name: zram
    state: present
  when: _zram_container_check.rc | default(0) != 0
  tags: [zram]

- name: Configure zram devices
  ansible.builtin.template:
    src: zram-generator.conf.j2
    dest: "{{ zram_config_file }}"
    owner: root
    group: root
    mode: "0644"
  register: zram_config_result
  tags: [zram]

- name: Regenerate zram systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - _zram_container_check.rc | default(0) != 0
    - zram_package_result.changed or zram_config_result.changed
  tags: [zram]

- name: Ensure configured zram swap devices are active
  ansible.builtin.include_tasks:
    file: activate.yml
    apply:
      tags: [zram]
  loop: "{{ zram_devices.keys() | list }}"
  loop_control:
    loop_var: zram_device
  when: _zram_container_check.rc | default(0) != 0
  tags: [zram]

- name: Set vm.swappiness for zram swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ zram_swappiness | string }}"
    sysctl_file: "{{ zram_sysctl_drop_in_file }}"
    sysctl_set: true
    state: present
    reload: true
  when: zram_manage_swappiness | bool
  tags: [zram, swappiness]
