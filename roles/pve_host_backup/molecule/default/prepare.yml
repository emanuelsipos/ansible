---
- name: Prepare
  hosts: all
  tasks:
    - name: Install PVE host backup test dependencies
      ansible.builtin.apt:
        name:
          - iproute2
          - jq
          - pciutils
          - sqlite3
          - util-linux
        state: present
        update_cache: true

    - name: Create test source directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/pve
        - /opt/test-tool

    - name: Create fake pmxcfs configuration
      ansible.builtin.copy:
        content: "test"
        dest: /etc/pve/test.conf
        owner: root
        group: root
        mode: "0600"

    - name: Mark fake pmxcfs mount as available
      ansible.builtin.file:
        path: /run/pve-host-backup-test-pmxcfs-mounted
        state: touch
        owner: root
        group: root
        mode: "0600"

    - name: Create selected root-owned configuration
      ansible.builtin.copy:
        content: "root@example.test"
        dest: /root/.forward
        owner: root
        group: root
        mode: "0600"

    - name: Create fake PVE cluster service for unit validation
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Fake PVE cluster service for Molecule

          [Service]
          Type=oneshot
          ExecStart=/bin/true
          RemainAfterExit=yes
        dest: /etc/systemd/system/pve-cluster.service
        owner: root
        group: root
        mode: "0644"

    - name: Create fake pmxcfs database directory
      ansible.builtin.file:
        path: /var/lib/pve-cluster
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create fake pmxcfs database
      ansible.builtin.command:
        argv:
          - sqlite3
          - /var/lib/pve-cluster/config.db
          - CREATE TABLE test (value TEXT); INSERT INTO test VALUES ('ok');
      args:
        creates: /var/lib/pve-cluster/config.db

    - name: Create disk inventory directory
      ansible.builtin.file:
        path: /dev/disk/by-id
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install fake PVE inventory commands
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          if [ "$(basename "$0")" = pveversion ] && \
              [ "${PBS_BACKUP_TEST_DROP_PMXCFS_AFTER_PREFLIGHT:-}" = 1 ]; then
              rm -f /run/pve-host-backup-test-pmxcfs-mounted
          fi
          if [ "$(basename "$0")" = pvecm ] && [ "${1:-}" = status ]; then
              printf '%s\n' 'Quorate: Yes'
          else
              printf '%s\n' "mock $(basename "$0") $*"
          fi
        dest: "/usr/local/bin/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - pct
        - pvecm
        - pvesm
        - pvesr
        - pveversion
        - qm
        - zdb
        - zfs
        - zpool

    - name: Install fake pmxcfs mount inspection commands
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          if [ "$(basename "$0")" = mountpoint ] && [ "${1:-}" = -q ] && \
              [ "${2:-}" = /etc/pve ]; then
              test -e /run/pve-host-backup-test-pmxcfs-mounted
              exit $?
          fi
          if [ "$(basename "$0")" = findmnt ] && [ "${1:-}" = --json ] && \
              [ "${2:-}" = --target ] && [ "${3:-}" = /etc/pve ]; then
              if test -e /run/pve-host-backup-test-pmxcfs-mounted; then
                  if test "${PBS_BACKUP_TEST_PMXCFS_IDENTITY:-}" = wrong; then
                      printf '%s\n' '{"filesystems":[{"target":"/etc/pve","source":"/dev/other","fstype":"ext4"}]}'
                  else
                      printf '%s\n' '{"filesystems":[{"target":"/etc/pve","source":"/dev/fuse","fstype":"fuse"}]}'
                  fi
              else
                  printf '%s\n' '{"filesystems":[]}'
              fi
              exit 0
          fi
          exec "/usr/bin/$(basename "$0")" "$@"
        dest: "/usr/local/bin/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - findmnt
        - mountpoint

    - name: Install fake Proxmox Backup Client
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          set -euo pipefail

          if [[ "${1:-}" == key && "${2:-}" == show ]]; then
              jq --exit-status '.data == "test"' "$3" >/dev/null
              exit 0
          fi

          [[ "${1:-}" == backup ]]
          if [[ -n "${PBS_BACKUP_CLIENT_CALL_LOG:-}" ]]; then
              printf '%s\n' "$*" >>"$PBS_BACKUP_CLIENT_CALL_LOG"
          fi
          if [[ -n "${PBS_BACKUP_CLIENT_ATTEMPT_LOG:-}" ]]; then
              printf '%s\n' "$*" >>"$PBS_BACKUP_CLIENT_ATTEMPT_LOG"
          fi
          if [[ "$(<"$PBS_PASSWORD_FILE")" != molecule-token-secret ]]; then
              exit 1
          fi
          if [[ -z "${PBS_ENCRYPTION_PASSWORD_FILE:-}" ]] || \
              [[ "$(<"$PBS_ENCRYPTION_PASSWORD_FILE")" != molecule-key-passphrase ]]; then
              exit 1
          fi

          if (( ${PBS_BACKUP_CLIENT_TRANSIENT_FAILURES:-0} > 0 )); then
              STATE_FILE=${PBS_BACKUP_CLIENT_STATE_FILE:-/run/pve-host-backup-test-client-state}
              ATTEMPT=0
              if [[ -f "$STATE_FILE" ]]; then
                  ATTEMPT=$(<"$STATE_FILE")
              fi
              ATTEMPT=$((ATTEMPT + 1))
              printf '%s\n' "$ATTEMPT" >"$STATE_FILE"
              if (( ATTEMPT <= PBS_BACKUP_CLIENT_TRANSIENT_FAILURES )); then
                  exit 1
              fi
          fi

          RECOVERY_DIR=""
          for arg in "$@"; do
              case "$arg" in
                  recovery.pxar:*) RECOVERY_DIR=${arg#recovery.pxar:} ;;
              esac
          done
          [[ -n "$RECOVERY_DIR" ]]
          sqlite3 "${RECOVERY_DIR}/pmxcfs-config.db" \
              'PRAGMA integrity_check;' | grep -Fx ok
          (
              cd "$RECOVERY_DIR"
              sha256sum --check SHA256SUMS
          )
          grep -Fx root@example.test \
              "${RECOVERY_DIR}/selected-root/root/.forward"
          printf '%s\n' "$@" > /run/pve-host-backup-test-arguments
        dest: /usr/local/bin/proxmox-backup-client
        owner: root
        group: root
        mode: "0755"
