---
- name: Verify PVE update policy
  hosts: all
  tasks:
    - name: Inspect PVE update-policy file
      ansible.builtin.stat:
        path: /etc/apt/apt.conf.d/99-pve-update-policy
      register: pve_update_policy_file

    - name: Verify PVE policy file
      ansible.builtin.assert:
        that:
          - pve_update_policy_file.stat.exists

    - name: Inspect PVE package-index timer state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - apt-daily.timer
      register: pve_update_policy_timer_state
      changed_when: false

    - name: Verify PVE package-index timer state
      ansible.builtin.assert:
        that:
          - pve_update_policy_timer_state.stdout == 'enabled'
          - pve_update_policy_timer_state.rc == 0

    - name: Inspect PVE package-index timer activity
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - apt-daily.timer
      register: pve_update_policy_index_timer_activity
      changed_when: false

    - name: Verify PVE package-index timer activity
      ansible.builtin.assert:
        that:
          - pve_update_policy_index_timer_activity.stdout == 'active'
          - pve_update_policy_index_timer_activity.rc == 0

    - name: Inspect base APT install-mode timer state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - apt-daily-upgrade.timer
      register: pve_update_policy_upgrade_timer_state
      changed_when: false
      failed_when: false

    - name: Verify base APT install-mode timer is disabled
      ansible.builtin.assert:
        that:
          - pve_update_policy_upgrade_timer_state.stdout == 'disabled'

    - name: Inspect base APT install-mode timer activity
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - apt-daily-upgrade.timer
      register: pve_update_policy_upgrade_timer_activity
      changed_when: false
      failed_when: false

    - name: Verify base APT install-mode timer is inactive
      ansible.builtin.assert:
        that:
          - pve_update_policy_upgrade_timer_activity.stdout == 'inactive'

    - name: Read PVE apt update policy
      ansible.builtin.slurp:
        src: /etc/apt/apt.conf.d/99-pve-update-policy
      register: pve_update_policy_configuration

    - name: Read effective PVE apt update policy
      ansible.builtin.command:
        argv:
          - apt-config
          - dump
      register: pve_update_policy_effective_apt_config
      changed_when: false

    - name: Verify controlled PVE update policy
      ansible.builtin.assert:
        that:
          - >-
            'APT::Periodic::Update-Package-Lists "1";' in
            (pve_update_policy_configuration.content | b64decode)
          - >-
            'APT::Periodic::Download-Upgradeable-Packages "0";' in
            (pve_update_policy_configuration.content | b64decode)
          - >-
            'APT::Periodic::AutocleanInterval "0";' in
            (pve_update_policy_configuration.content | b64decode)
          - >-
            'APT::Periodic::Update-Package-Lists "1";' in
            pve_update_policy_effective_apt_config.stdout
          - >-
            'APT::Periodic::Download-Upgradeable-Packages "0";' in
            pve_update_policy_effective_apt_config.stdout
          - >-
            'APT::Periodic::AutocleanInterval "0";' in
            pve_update_policy_effective_apt_config.stdout

    - name: Verify a harmless APT-path argument does not block policy
      block:
        - name: Start harmless APT-path argument fixture
          ansible.builtin.systemd_service:
            name: molecule-apt-argument.service
            state: started

        - name: Wait for harmless APT-path argument fixture
          ansible.builtin.command:
            argv:
              - systemctl
              - is-active
              - --quiet
              - molecule-apt-argument.service
          register: pve_update_policy_argument_fixture_active
          until: pve_update_policy_argument_fixture_active.rc == 0
          retries: 10
          delay: 1
          changed_when: false

        - name: Reapply policy with harmless APT-path argument
          ansible.builtin.include_role:
            name: pve_update_policy
      always:
        - name: Stop harmless APT-path argument fixture
          ansible.builtin.systemd_service:
            name: molecule-apt-argument.service
            state: stopped

    - name: Verify policy refuses active package-manager processes
      ansible.builtin.include_tasks: tasks/process-case.yml
      loop:
        - name: apt
          service: molecule-apt-transaction.service
        - name: apt-get
          service: molecule-apt-get-transaction.service
        - name: dpkg
          service: molecule-dpkg-transaction.service
        - name: apt.systemd.daily
          service: molecule-apt-systemd-daily.service
      loop_control:
        loop_var: pve_update_policy_process_case

    - name: Verify policy safely refuses an active base APT service
      block:
        - name: Start active base APT service fixture
          ansible.builtin.systemd_service:
            name: apt-daily.service
            state: started

        - name: Reapply policy during active base APT service
          ansible.builtin.include_role:
            name: pve_update_policy

        - name: Record active base APT service was accepted
          ansible.builtin.set_fact:
            pve_update_policy_active_service_accepted: true
      rescue:
        - name: Inspect base APT service after refusal
          ansible.builtin.command:
            argv:
              - systemctl
              - is-active
              - --quiet
              - apt-daily.service
          register: pve_update_policy_active_service
          changed_when: false
          failed_when: false
      always:
        - name: Stop active base APT service fixture
          ansible.builtin.systemd_service:
            name: apt-daily.service
            state: stopped

    - name: Confirm policy safely refused active base APT service
      ansible.builtin.assert:
        that:
          - pve_update_policy_active_service_accepted is not defined
          - pve_update_policy_active_service.rc == 0
