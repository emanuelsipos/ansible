---
- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"
  tags: [journald]

- name: Configure journald retention
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/retention.conf
    mode: "0644"
    content: |
      [Journal]
      MaxRetentionSec={{ journald_retention_days }}day
      SystemMaxUse={{ journald_retention_system_max_use }}
      Storage={{ journald_retention_storage }}
  notify: Restart journald
  tags: [journald]

- name: Vacuum old logs immediately
  ansible.builtin.command: journalctl --vacuum-time={{ journald_retention_days }}day
  changed_when: false
  tags: [journald]
