---
_tailscale_dns_valid_address_pattern: >-
  (?x)^
  (?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}
  (?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)
  $
  |
  ^(?!.*::.*::)(?=[0-9a-f:]*[0-9a-f])
  [0-9a-f]{0,4}(?::[0-9a-f]{0,4}){2,7}$
_tailscale_dns_dhcp_address_token_pattern: >-
  (?ix)(?:
    (?:[0-9]{1,3}\.){3}[0-9]{1,3}
    |
    [0-9a-f]{1,4}(?::[0-9a-f]{0,4}){2,7}
  )
