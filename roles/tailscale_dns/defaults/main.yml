---
tailscale_dns_resolved_package: systemd-resolved
tailscale_dns_resolved_service: systemd-resolved
tailscale_dns_resolv_conf_path: /etc/resolv.conf
tailscale_dns_resolv_conf_target: /run/systemd/resolve/stub-resolv.conf
tailscale_dns_resolved_dropin_dir: /etc/systemd/resolved.conf.d
tailscale_dns_resolved_dropin_path: "{{ tailscale_dns_resolved_dropin_dir }}/tailscale-dns.conf"
tailscale_dns_state_dir: /var/lib/tailscale-dns
tailscale_dns_state_marker: "{{ tailscale_dns_state_dir }}/managed"
tailscale_dns_tailscaled_service: tailscaled
tailscale_dns_bootstrap_nameservers: []
tailscale_dns_bootstrap_search_domains: []
tailscale_dns_tailscale_resolver_ips:
  - 100.100.100.100
  - fd7a:115c:a1e0::53
