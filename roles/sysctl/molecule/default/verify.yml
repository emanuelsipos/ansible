---
- name: Verify
  hosts: all
  tasks:
    - name: Check sysctl drop-in file exists
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-custom.conf
      register: sysctl_conf

    - name: Assert file was created
      ansible.builtin.assert:
        that:
          - sysctl_conf.stat.exists

    - name: Read sysctl file
      ansible.builtin.slurp:
        src: /etc/sysctl.d/99-custom.conf
      register: sysctl_content

    - name: Assert sysctl settings are present
      ansible.builtin.assert:
        that:
          - "'net.core.somaxconn=1024' in (sysctl_content['content'] | b64decode)"
          - "'vm.swappiness=10' in (sysctl_content['content'] | b64decode)"

    - name: Read live sysctl settings
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - "{{ item.key }}"
      loop:
        - key: net.core.somaxconn
          value: "1024"
        - key: vm.swappiness
          value: "10"
      register: sysctl_live_values
      changed_when: false

    - name: Assert sysctl settings are active
      ansible.builtin.assert:
        that:
          - item.stdout == item.item.value
      loop: "{{ sysctl_live_values.results }}"

    - name: Assert settings avoid a global sysctl reload
      ansible.builtin.assert:
        that:
          - >-
            'sysctl_set: true' in
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../../tasks/main.yml'
            )
          - >-
            'reload: false' in
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../../tasks/main.yml'
            )
