            path: "{{ item }}"
          loop:
            - /etc/github-release-updater/test-project-28864cfb70bd.token
            - /etc/github-release-updater/test-project-8e5b720cd9fe.token
          register: github_release_download_disabled_tokens

        - name: Read cron jobs after disabling one destination
          ansible.builtin.command:
            cmd: crontab -l
          register: github_release_download_disabled_crontab
          changed_when: false

        - name: Verify disabling one updater preserves the other
          ansible.builtin.assert:
            that:
              - github_release_download_disabled_scripts.results[0].stat.exists
              - not github_release_download_disabled_scripts.results[1].stat.exists
              - github_release_download_disabled_tokens.results[0].stat.exists
              - not github_release_download_disabled_tokens.results[1].stat.exists
              - >-
                'github-release-update-test-project-asset-bin-28864cfb70bd.sh'
                in github_release_download_disabled_crontab.stdout
              - >-
                'github-release-update-test-project-asset-bin-8e5b720cd9fe.sh'
                not in github_release_download_disabled_crontab.stdout

