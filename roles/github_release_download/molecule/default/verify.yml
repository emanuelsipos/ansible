---
- name: Verify
  hosts: all
  tasks:
    - name: Read downloaded asset
      ansible.builtin.slurp:
        src: /opt/test-release/asset.bin
      register: github_release_download_test_asset

    - name: Inspect updater files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/github-release-updater
        - /etc/github-release-updater/test-project.token
        - /opt/test-release/updater/github-release-update-test-project-asset-bin.sh
      register: github_release_download_updater_files

    - name: Read updater script
      ansible.builtin.slurp:
        src: /opt/test-release/updater/github-release-update-test-project-asset-bin.sh
      register: github_release_download_updater_script

    - name: Verify release hardening
      ansible.builtin.assert:
        that:
          - (github_release_download_test_asset.content | b64decode) == 'verified release asset\n'
          - github_release_download_updater_files.results[0].stat.mode == '0700'
          - github_release_download_updater_files.results[1].stat.mode == '0600'
          - github_release_download_updater_files.results[2].stat.mode == '0700'
          - "'molecule-test-token' not in (github_release_download_updater_script.content | b64decode)"
          - "'EXISTING_UID' in (github_release_download_updater_script.content | b64decode)"

    - name: Inspect controller post-update marker
      ansible.builtin.stat:
        path: /tmp/release-post-update
      register: github_release_download_controller_post_update_marker

    - name: Verify controller post-update command
      ansible.builtin.assert:
        that:
          - github_release_download_controller_post_update_marker.stat.exists

    - name: Remove controller post-update marker
      ansible.builtin.file:
        path: /tmp/release-post-update
        state: absent

    - name: Corrupt the installed release asset
      ansible.builtin.copy:
        content: "corrupted\n"
        dest: /opt/test-release/asset.bin
        mode: "0755"

    - name: Run updater against the current release
      ansible.builtin.command:
        cmd: /opt/test-release/updater/github-release-update-test-project-asset-bin.sh
      changed_when: true

    - name: Read repaired release asset
      ansible.builtin.slurp:
        src: /opt/test-release/asset.bin
      register: github_release_download_repaired_asset

    - name: Inspect post-update marker
      ansible.builtin.stat:
        path: /tmp/release-post-update
      register: github_release_download_post_update_marker

    - name: Verify corrupted release asset was repaired
      ansible.builtin.assert:
        that:
          - (github_release_download_repaired_asset.content | b64decode) == 'verified release asset\n'
          - github_release_download_post_update_marker.stat.exists
