---
- name: Prepare release API fixture
  hosts: all
  tasks:
    - name: Refresh package metadata
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Create fixture directories
      ansible.builtin.file:
        path: "/tmp/github-release-fixture/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - test/project/releases
        - test/project/releases/tags
        - test/invalid/releases
        - test/redirect/releases
        - test/cross-origin/releases
        - downloads
        - downloads/redirect

    - name: Write release asset
      ansible.builtin.copy:
        content: "verified release asset\n"
        dest: /tmp/github-release-fixture/downloads/asset.bin
        mode: "0644"

    - name: Write checksum asset
      ansible.builtin.copy:
        content: "8C76B21B0BAC56B7CBDF8558106B98602CCEE25504AE1604984F2078E84B009F  asset.bin\n"
        dest: /tmp/github-release-fixture/downloads/checksums.txt
        mode: "0644"

    - name: Write release API response
      ansible.builtin.copy:
        content: |
          {
            "tag_name": "v1.0.0",
            "assets": [
              {
                "name": "asset.bin",
                "url": "http://127.0.0.1:8000/downloads/asset.bin",
                "browser_download_url": "http://127.0.0.1:8000/downloads/asset.bin",
                "digest": "sha256:8C76B21B0BAC56B7CBDF8558106B98602CCEE25504AE1604984F2078E84B009F"
              },
              {
                "name": "checksums.txt",
                "url": "http://127.0.0.1:8000/downloads/checksums.txt",
                "browser_download_url": "http://127.0.0.1:8000/downloads/checksums.txt"
              }
            ]
          }
        dest: /tmp/github-release-fixture/test/project/releases/latest
        mode: "0644"

    - name: Write tagged release API response
      ansible.builtin.copy:
        content: |
          {
            "tag_name": "v1.0.0",
            "assets": [
              {
                "name": "asset.bin",
                "url": "http://127.0.0.1:8000/downloads/asset.bin",
                "browser_download_url": "http://127.0.0.1:8000/downloads/asset.bin",
                "digest": "sha256:8C76B21B0BAC56B7CBDF8558106B98602CCEE25504AE1604984F2078E84B009F"
              },
              {
                "name": "checksums.txt",
                "url": "http://127.0.0.1:8000/downloads/checksums.txt",
                "browser_download_url": "http://127.0.0.1:8000/downloads/checksums.txt"
              }
            ]
          }
        dest: /tmp/github-release-fixture/test/project/releases/tags/v1.0.0
        mode: "0644"

    - name: Write release API response with an invalid digest
      ansible.builtin.copy:
        content: |
          {
            "tag_name": "v1.0.0",
            "assets": [
              {
                "name": "asset.bin",
                "url": "http://127.0.0.1:8000/downloads/asset.bin",
                "browser_download_url": "http://127.0.0.1:8000/downloads/asset.bin",
                "digest": "sha256:not-a-digest"
              }
            ]
          }
        dest: /tmp/github-release-fixture/test/invalid/releases/latest
        mode: "0644"

    - name: Write release API response with an insecure redirect
      ansible.builtin.copy:
        content: |
          {
            "tag_name": "v1.0.0",
            "assets": [
              {
                "name": "asset.bin",
                "url": "http://127.0.0.1:8000/downloads/redirect",
                "browser_download_url": "http://127.0.0.1:8000/downloads/redirect",
                "digest": "sha256:8C76B21B0BAC56B7CBDF8558106B98602CCEE25504AE1604984F2078E84B009F"
              }
            ]
          }
        dest: /tmp/github-release-fixture/test/redirect/releases/latest
        mode: "0644"

    - name: Write release API response with a cross-origin authenticated asset
      ansible.builtin.copy:
        content: |
          {
            "tag_name": "v1.0.0",
            "assets": [
              {
                "name": "asset.bin",
                "url": "http://127.0.0.1:8001/downloads/asset.bin",
                "browser_download_url": "http://127.0.0.1:8001/downloads/asset.bin",
                "digest": "sha256:8C76B21B0BAC56B7CBDF8558106B98602CCEE25504AE1604984F2078E84B009F"
              }
            ]
          }
        dest: /tmp/github-release-fixture/test/cross-origin/releases/latest
        mode: "0644"

    - name: Start fixture server
      ansible.builtin.shell: >-
        nohup python3 -m http.server 8000
        --directory /tmp/github-release-fixture
        >/tmp/github-release-fixture/server.log 2>&1 &
      args:
        creates: /tmp/github-release-fixture/server.pid

    - name: Record fixture server startup
      ansible.builtin.copy:
        content: started
        dest: /tmp/github-release-fixture/server.pid
        mode: "0644"

    - name: Wait for fixture API
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/test/project/releases/latest
        return_content: true
      register: github_release_download_fixture
      until: github_release_download_fixture.status == 200
      retries: 10
      delay: 1
