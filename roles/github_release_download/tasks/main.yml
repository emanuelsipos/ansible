---
# tasks/main.yml - Download files from GitHub releases with version checking

- name: Validate required GitHub release variables
  ansible.builtin.assert:
    that:
      - github_release_download_repo is defined
      - github_release_download_repo is string
      - github_release_download_repo is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
      - not github_release_download_repo is search('[\r\n]')
      - github_release_download_asset is defined
      - github_release_download_asset is string
      - github_release_download_asset is match('^[^/\s\r\n]+$')
      - not github_release_download_asset is search('\s')
      - github_release_download_dest is defined
      - github_release_download_dest is string
      - github_release_download_dest is match('^/.*[^/]$')
      - not github_release_download_dest is search('(^|/)\.\.?(?:/|$)')
      - not github_release_download_dest is search('//')
      - not github_release_download_dest is search('[\r\n]')
      - github_release_download_api_url is string
      - >-
        github_release_download_api_url is match('^https://[^\r\n]+$') or
        github_release_download_api_url
        is match('^http://(127[.]0[.]0[.]1|localhost)(:[0-9]+)?(/|$)')
      - not github_release_download_api_url is search('[\r\n]')
      - >-
        github_release_download_token is not defined or
        (
          github_release_download_token is string and
          not github_release_download_token is search('[\r\n]')
        )
      - >-
        github_release_download_version is not defined or
        (
          github_release_download_version is string and
          not github_release_download_version is search('[\r\n]')
        )
      - >-
        github_release_download_checksum is not defined or
        (
          github_release_download_checksum is string and
          github_release_download_checksum is match('^sha256:[a-fA-F0-9]{64}$') and
          not github_release_download_checksum is search('[\r\n]')
        )
      - github_release_download_checksum is not defined or github_release_download_checksum_asset is not defined
      - github_release_download_checksum is not defined or github_release_download_version is defined
      - github_release_download_allow_unverified is boolean
      - >-
        github_release_download_checksum_asset is not defined or
        (
          github_release_download_checksum_asset is string and
          github_release_download_checksum_asset is match('^[^/\s\r\n]+$') and
          not github_release_download_checksum_asset is search('\s')
        )
      - >-
        not (github_release_download_cron_enabled | default(false)) or
        github_release_download_cron_user == 'root'
      - >-
        not (github_release_download_cron_enabled | default(false)) or
        (
          github_release_download_cron_minute is string and
          github_release_download_cron_minute is match('^(\*|[0-5]?[0-9](-[0-5]?[0-9])?)(/[1-9][0-9]*)?(,(\*|[0-5]?[0-9](-[0-5]?[0-9])?)(/[1-9][0-9]*)?)*$') and
          not github_release_download_cron_minute is search('\s')
        )
      - >-
        not (github_release_download_cron_enabled | default(false)) or
        (
          github_release_download_cron_hour is string and
          github_release_download_cron_hour is match('^(\*|([01]?[0-9]|2[0-3])(-([01]?[0-9]|2[0-3]))?)(/[1-9][0-9]*)?(,(\*|([01]?[0-9]|2[0-3])(-([01]?[0-9]|2[0-3]))?)(/[1-9][0-9]*)?)*$') and
          not github_release_download_cron_hour is search('\s')
        )
      - >-
        not (github_release_download_cron_enabled | default(false)) or
        (
          github_release_download_cron_day is string and
          github_release_download_cron_day is match('^(\*|([1-9]|[12][0-9]|3[01])(-([1-9]|[12][0-9]|3[01]))?)(/[1-9][0-9]*)?(,(\*|([1-9]|[12][0-9]|3[01])(-([1-9]|[12][0-9]|3[01]))?)(/[1-9][0-9]*)?)*$') and
          not github_release_download_cron_day is search('\s')
        )
      - >-
        not (github_release_download_cron_enabled | default(false)) or
        (
          github_release_download_cron_weekday is string and
          github_release_download_cron_weekday is match('^(\*|[0-7](-[0-7])?)(/[1-9][0-9]*)?(,(\*|[0-7](-[0-7])?)(/[1-9][0-9]*)?)*$') and
          not github_release_download_cron_weekday is search('\s')
        )
      - >-
        not (github_release_download_cron_enabled | default(false)) or
        (
          github_release_download_cron_month is string and
          github_release_download_cron_month is match('^(\*|([1-9]|1[0-2])(-([1-9]|1[0-2]))?)(/[1-9][0-9]*)?(,(\*|([1-9]|1[0-2])(-([1-9]|1[0-2]))?)(/[1-9][0-9]*)?)*$') and
          not github_release_download_cron_month is search('\s')
        )
      - >-
        not (github_release_download_cron_enabled | default(false)) or
        (
          (github_release_download_mode is string or github_release_download_mode is number) and
          (github_release_download_mode | string) is match('^[0-7]{3,4}$')
        )
      - >-
        not (github_release_download_cron_enabled | default(false)) or
        (
          github_release_download_owner is not defined or
          (
            github_release_download_owner is number or
            (
              github_release_download_owner is string and
              not github_release_download_owner is search('[\r\n]')
            )
          )
        )
      - >-
        not (github_release_download_cron_enabled | default(false)) or
        (
          github_release_download_group is not defined or
          (
            github_release_download_group is number or
            (
              github_release_download_group is string and
              not github_release_download_group is search('[\r\n]')
            )
          )
        )
      - github_release_download_cron_script_dir is string
      - github_release_download_cron_script_dir is match('^/.*[^/]$')
      - not github_release_download_cron_script_dir is search('(^|/)\.\.?(?:/|$)')
      - not github_release_download_cron_script_dir is search('//')
      - not github_release_download_cron_script_dir is search('[\r\n]')
      - >-
        not (github_release_download_cron_enabled | default(false)) or
        (
          github_release_download_cron_log_file is string and
          github_release_download_cron_log_file is match('^/.*[^/]$') and
          not github_release_download_cron_log_file is search('(^|/)\.\.?(?:/|$)') and
          not github_release_download_cron_log_file is search('[\r\n]')
        )
      - >-
        github_release_download_lock_wait_seconds is integer and
        github_release_download_lock_wait_seconds is not boolean and
        github_release_download_lock_wait_seconds | int >= 1 and
        github_release_download_lock_wait_seconds | int <= 300
      - >-
        github_release_download_lock_dir is string and
        github_release_download_lock_dir is match('^/.*[^/]$') and
        not github_release_download_lock_dir is search('(^|/)\.\.?(?:/|$)') and
        not github_release_download_lock_dir is search('[\r\n]')
      - github_release_download_token_file is string
      - >-
        github_release_download_token_file
        is match('^/etc/github-release-updater/[^/]+$')
      - not github_release_download_token_file is search('/\.\.?$')
      - not github_release_download_token_file is search('[\r\n]')
    quiet: true
    fail_msg: Invalid or missing github_release_download role variables
  tags: [github_release]

- name: Validate existing scripts directory ancestry
  ansible.builtin.include_tasks: validate-directory.yml
  vars:
    github_release_download_directory_path: >-
      {{ github_release_download_cron_script_dir }}
    github_release_download_directory_allow_missing: true
  tags: [github_release, cron]

- name: Validate existing cron updater token directory ancestry
  ansible.builtin.include_tasks: validate-directory.yml
  vars:
    github_release_download_directory_path: >-
      {{ github_release_download_token_file | dirname }}
    github_release_download_directory_allow_missing: true
  tags: [github_release, cron]

- name: Inspect existing destination directory
  ansible.builtin.stat:
    path: "{{ github_release_download_dest | dirname }}"
    follow: false
  register: github_release_download_existing_dest_dir
  tags: [github_release]

- name: Validate existing destination directory ancestry
  ansible.builtin.include_tasks: validate-directory.yml
  vars:
    github_release_download_directory_path: >-
      {{ github_release_download_dest | dirname }}
    github_release_download_directory_allow_missing: true
  tags: [github_release]

- name: Ensure destination directory exists
  ansible.builtin.file:
    path: "{{ github_release_download_dest | dirname }}"
    state: directory
    mode: "0755"
  when: not github_release_download_existing_dest_dir.stat.exists
  tags: [github_release]

- name: Validate destination directory ancestry
  ansible.builtin.include_tasks: validate-directory.yml
  vars:
    github_release_download_directory_path: >-
      {{ github_release_download_dest | dirname }}
    github_release_download_directory_allow_missing: false
  tags: [github_release]

- name: Set release paths and updater identities
  ansible.builtin.set_fact:
    github_release_download_api_origin: >-
      {{ github_release_download_api_url | regex_search('^https?://[^/]+') }}
    github_release_download_version_file: "{{ github_release_download_dest }}.ver"
    github_release_download_lock_file: >-
      {{ github_release_download_lock_dir }}/{{
        github_release_download_dest | hash('sha256')
      }}.lock
    github_release_download_script_name: >-
      github-release-update-{{
        (github_release_download_repo ~ '-' ~ github_release_download_asset)
        | regex_replace('[^a-zA-Z0-9]', '-')
      }}-{{ (github_release_download_dest | hash('sha256'))[0:12] }}.sh
    github_release_download_repository_script_name: >-
      github-release-update-{{
        (github_release_download_repo ~ '-' ~ github_release_download_asset)
        | regex_replace('[^a-zA-Z0-9]', '-')
      }}-{{
        ((github_release_download_repo ~ '/' ~ github_release_download_asset)
        | hash('sha256'))[0:12]
      }}.sh
    github_release_download_legacy_script_name: >-
      github-release-update-{{
        (github_release_download_repo ~ '-' ~ github_release_download_asset)
        | regex_replace('[^a-zA-Z0-9]', '-')
      }}.sh
    github_release_download_cron_name: >-
      {{ 'GitHub release auto-update: ' ~ github_release_download_repo ~ '/' ~
         github_release_download_asset ~ ' -> ' ~ github_release_download_dest }}
    github_release_download_repository_cron_name: >-
      {{ 'GitHub release auto-update: ' ~ github_release_download_repo ~ '/' ~
         github_release_download_asset }}
    github_release_download_repository_token_file: >-
      /etc/github-release-updater/{{
        github_release_download_repo | regex_replace('[^a-zA-Z0-9]', '-')
      }}-{{ (github_release_download_repo | hash('sha256'))[0:12] }}.token
    github_release_download_legacy_token_file: >-
      /etc/github-release-updater/{{
        github_release_download_repo | regex_replace('[^a-zA-Z0-9]', '-')
      }}.token
  tags: [github_release]

- name: Install release update lock dependency
  ansible.builtin.package:
    name: "{{ github_release_download_packages }}"
    state: present
  tags: [github_release]

- name: Validate existing release update lock directory ancestry
  ansible.builtin.include_tasks: validate-directory.yml
  vars:
    github_release_download_directory_path: "{{ github_release_download_lock_dir }}"
    github_release_download_directory_allow_missing: true
  tags: [github_release]

- name: Ensure release update lock directory exists
  ansible.builtin.file:
    path: "{{ github_release_download_lock_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [github_release]

- name: Validate release update lock directory ancestry
  ansible.builtin.include_tasks: validate-directory.yml
  vars:
    github_release_download_directory_path: "{{ github_release_download_lock_dir }}"
    github_release_download_directory_allow_missing: false
  tags: [github_release]

- name: Ensure release update lock file exists
  ansible.builtin.file:
    path: "{{ github_release_download_lock_file }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
    access_time: preserve
    modification_time: preserve
  tags: [github_release]

- name: Update release while holding shared lock
  tags: [github_release]
  block:
    - name: Create controller lock state directory
      ansible.builtin.tempfile:
        state: directory
        prefix: github-release-download-lock.
      register: github_release_download_lock_state
      changed_when: false

    - name: Start shared release update lock holder
      ansible.builtin.shell: |
        set -euo pipefail
        nohup /bin/bash -c '
          status=0
          flock --exclusive --wait "$1" "$2" \
            /bin/sh -c '\''touch "$1"; while [ ! -e "$2" ]; do sleep 1; done'\'' \
            sh "$3" "$4" || status=$?
          printf "%s\n" "$status" > "$5"
          touch "$6"
        ' bash \
          {{ github_release_download_lock_wait_seconds | quote }} \
          {{ github_release_download_lock_file | quote }} \
          {{ (github_release_download_lock_state.path ~ '/ready') | quote }} \
          {{ (github_release_download_lock_state.path ~ '/release') | quote }} \
          {{ (github_release_download_lock_state.path ~ '/status') | quote }} \
          {{ (github_release_download_lock_state.path ~ '/done') | quote }} \
          </dev/null >/dev/null 2>&1 &
      args:
        executable: /bin/bash
      changed_when: false

    - name: Update release under controller lock
      block:
        - name: Wait for shared release update lock
          ansible.builtin.wait_for:
            path: "{{ github_release_download_lock_state.path }}/ready"
            state: present
            timeout: "{{ (github_release_download_lock_wait_seconds | int) + 5 }}"
          failed_when: false

        - name: Inspect shared release update lock state
          ansible.builtin.stat:
            path: "{{ github_release_download_lock_state.path }}/ready"
          register: github_release_download_lock_ready

        - name: Require shared release update lock acquisition
          ansible.builtin.assert:
            that:
              - github_release_download_lock_ready.stat.exists
            quiet: true
            fail_msg: >-
              Timed out waiting for the release update lock at
              {{ github_release_download_lock_file }}

        - name: Update release state and activate asset
          ansible.builtin.include_tasks: update.yml
      always:
        - name: Signal shared release update lock release
          ansible.builtin.file:
            path: "{{ github_release_download_lock_state.path }}/release"
            state: touch
            mode: "0600"
          changed_when: false

        - name: Wait for lock holder to exit
          ansible.builtin.wait_for:
            path: "{{ github_release_download_lock_state.path }}/done"
            state: present
            timeout: 10
          failed_when: false

        - name: Inspect lock holder exit state
          ansible.builtin.stat:
            path: "{{ github_release_download_lock_state.path }}/done"
          register: github_release_download_lock_done

        - name: Read lock holder exit status
          ansible.builtin.slurp:
            src: "{{ github_release_download_lock_state.path }}/status"
          register: github_release_download_lock_status
          failed_when: false
          when: github_release_download_lock_done.stat.exists

    - name: Verify shared release update lock holder exited cleanly
      ansible.builtin.assert:
        that:
          - github_release_download_lock_status.content is defined
          - >-
            (github_release_download_lock_status.content | default('')
            | b64decode | trim) == '0'
        quiet: true
        fail_msg: >-
          The release update lock holder did not exit cleanly.
  always:
    - name: Remove controller lock state directory
      ansible.builtin.file:
        path: "{{ github_release_download_lock_state.path | default('') }}"
        state: absent
      changed_when: false
      when:
        - github_release_download_lock_state.path | default('') | length > 0
        - github_release_download_lock_done.stat.exists | default(false)

# Cron auto-update setup
- name: Setup cron auto-update
  when: github_release_download_cron_enabled | default(false)
  tags: [github_release, cron]
  block:
    - name: Install cron updater dependencies
      ansible.builtin.package:
        name: "{{ github_release_download_cron_packages }}"
        state: present

    - name: Ensure scripts directory exists
      ansible.builtin.file:
        path: "{{ github_release_download_cron_script_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Validate scripts directory ancestry
      ansible.builtin.include_tasks: validate-directory.yml
      vars:
        github_release_download_directory_path: >-
          {{ github_release_download_cron_script_dir }}
        github_release_download_directory_allow_missing: false

    - name: Require a trusted cron updater log directory
      ansible.builtin.include_tasks: validate-directory.yml
      vars:
        github_release_download_directory_path: >-
          {{ github_release_download_cron_log_file | dirname }}
        github_release_download_directory_allow_missing: false

    - name: Inspect cron updater log file
      ansible.builtin.stat:
        path: "{{ github_release_download_cron_log_file }}"
        follow: false
      register: github_release_download_log_file

    - name: Require a trusted existing cron updater log file
      ansible.builtin.assert:
        that:
          - >-
            not github_release_download_log_file.stat.exists or
            (
              github_release_download_log_file.stat.isreg and
              not github_release_download_log_file.stat.islnk and
              github_release_download_log_file.stat.uid == 0 and
              github_release_download_log_file.stat.mode
              is match('^[0-7][0-7][0145][0145]$')
            )
        quiet: true
        fail_msg: >-
          An existing cron updater log must be a root-owned regular file that
          is not a symlink and is not writable by group or other users.

    - name: Ensure cron updater log file exists securely
      ansible.builtin.file:
        path: "{{ github_release_download_cron_log_file }}"
        state: touch
        owner: root
        group: root
        mode: "0600"
        access_time: preserve
        modification_time: preserve

    - name: Ensure cron updater token directory exists
      ansible.builtin.file:
        path: "{{ github_release_download_token_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: github_release_download_token is defined

    - name: Validate cron updater token directory ancestry
      ansible.builtin.include_tasks: validate-directory.yml
      vars:
        github_release_download_directory_path: >-
          {{ github_release_download_token_file | dirname }}
        github_release_download_directory_allow_missing: false
      when: github_release_download_token is defined

    - name: Store GitHub API token for the cron updater
      ansible.builtin.copy:
        content: "{{ github_release_download_token }}\n"
        dest: "{{ github_release_download_token_file }}"
        owner: root
        group: root
        mode: "0600"
      when: github_release_download_token is defined
      no_log: true

    - name: Remove an obsolete cron updater token file
      ansible.builtin.file:
        path: "{{ github_release_download_token_file }}"
        state: absent
      when: github_release_download_token is not defined

    - name: Remove legacy collision-prone cron updater token file
      ansible.builtin.file:
        path: "{{ github_release_download_legacy_token_file }}"
        state: absent
      when: github_release_download_token_file != github_release_download_legacy_token_file

    - name: Remove repository-only cron updater token file
      ansible.builtin.file:
        path: "{{ github_release_download_repository_token_file }}"
        state: absent
      when: github_release_download_token_file != github_release_download_repository_token_file

    - name: Remove obsolete shared updater token file
      ansible.builtin.file:
        path: /etc/github-release-updater/github.token
        state: absent
      when: github_release_download_token_file != '/etc/github-release-updater/github.token'

    - name: Deploy auto-update script
      ansible.builtin.template:
        src: update-script.sh.j2
        dest: "{{ github_release_download_cron_script_dir }}/{{ github_release_download_script_name }}"
        owner: root
        group: root
        mode: "0700"

    - name: Remove legacy collision-prone updater script
      ansible.builtin.file:
        path: >-
          {{ github_release_download_cron_script_dir }}/{{
            github_release_download_legacy_script_name
          }}
        state: absent

    - name: Remove repository-only updater script
      ansible.builtin.file:
        path: >-
          {{ github_release_download_cron_script_dir ~ '/' ~
             github_release_download_repository_script_name }}
        state: absent

    - name: Remove obsolete asset-only updater script
      ansible.builtin.file:
        path: >-
          {{ github_release_download_cron_script_dir }}/github-release-update-{{
            github_release_download_asset | regex_replace('[^a-zA-Z0-9]', '-')
          }}.sh
        state: absent

    - name: Remove obsolete asset-only cron job
      ansible.builtin.cron:
        name: "GitHub release auto-update: {{ github_release_download_asset }}"
        user: "{{ github_release_download_cron_user }}"
        state: absent

    - name: Remove repository-only cron job
      ansible.builtin.cron:
        name: "{{ github_release_download_repository_cron_name }}"
        user: "{{ github_release_download_cron_user }}"
        state: absent

    - name: Setup cron job for auto-update
      ansible.builtin.cron:
        name: "{{ github_release_download_cron_name }}"
        minute: "{{ github_release_download_cron_minute }}"
        hour: "{{ github_release_download_cron_hour }}"
        day: "{{ github_release_download_cron_day }}"
        weekday: "{{ github_release_download_cron_weekday }}"
        month: "{{ github_release_download_cron_month }}"
        job: >-
          {{
            "'" ~
            (
              github_release_download_cron_script_dir ~ '/' ~ github_release_download_script_name
            ) | replace("'", "'\"'\"'")
            ~ "'"
          }}
        user: "{{ github_release_download_cron_user }}"
        state: present

- name: Inspect crontab command for disabled updater cleanup
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - command -v crontab
  register: github_release_download_crontab_command
  changed_when: false
  failed_when: false
  when: not (github_release_download_cron_enabled | default(false))
  tags: [github_release, cron]

- name: Remove disabled cron auto-update
  when: not (github_release_download_cron_enabled | default(false))
  tags: [github_release, cron]
  block:
    - name: Remove disabled cron jobs
      ansible.builtin.cron:
        name: "{{ item }}"
        user: "{{ github_release_download_cron_user }}"
        state: absent
      loop:
        - "{{ github_release_download_cron_name }}"
        - "{{ github_release_download_repository_cron_name }}"
        - "GitHub release auto-update: {{ github_release_download_asset }}"
      when: github_release_download_crontab_command.rc == 0

    - name: Remove disabled updater scripts
      ansible.builtin.file:
        path: "{{ github_release_download_cron_script_dir }}/{{ item }}"
        state: absent
      loop:
        - "{{ github_release_download_script_name }}"
        - "{{ github_release_download_repository_script_name }}"
        - "{{ github_release_download_legacy_script_name }}"
        - >-
          github-release-update-{{
            github_release_download_asset | regex_replace('[^a-zA-Z0-9]', '-')
          }}.sh

    - name: Remove disabled updater token files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ github_release_download_token_file }}"
        - "{{ github_release_download_repository_token_file }}"
        - "{{ github_release_download_legacy_token_file }}"
