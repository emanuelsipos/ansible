---
# tasks/main.yml - Download files from GitHub releases with version checking

- name: Validate required GitHub release variables
  ansible.builtin.assert:
    that:
      - github_release_download_repo is defined
      - github_release_download_repo is match('^[^/]+/[^/]+$')
      - github_release_download_asset is defined
      - github_release_download_asset | length > 0
      - github_release_download_dest is defined
      - github_release_download_dest is match('^/')
      - >-
        github_release_download_checksum is not defined or
        github_release_download_checksum is match('^sha256:[a-fA-F0-9]{64}$')
      - github_release_download_checksum is not defined or github_release_download_checksum_asset is not defined
      - github_release_download_allow_unverified is boolean
      - >-
        github_release_download_checksum_asset is not defined or
        github_release_download_checksum_asset | length > 0
      - >-
        not (github_release_download_cron_enabled | default(false)) or
        github_release_download_cron_user == 'root'
    quiet: true
    fail_msg: Invalid or missing github_release_download role variables
  tags: [github_release]

- name: Ensure destination directory exists
  ansible.builtin.file:
    path: "{{ github_release_download_dest | dirname }}"
    state: directory
    mode: '0755'
  tags: [github_release]

- name: Set version file path
  ansible.builtin.set_fact:
    github_release_download_version_file: "{{ github_release_download_dest }}.ver"
  tags: [github_release]

- name: Check if file exists
  ansible.builtin.stat:
    path: "{{ github_release_download_dest }}"
    checksum_algorithm: sha256
  register: github_release_download_file_stat
  tags: [github_release]

- name: Check if version file exists
  ansible.builtin.stat:
    path: "{{ github_release_download_version_file }}"
  register: github_release_download_version_file_stat
  tags: [github_release]

- name: Read current version from version file
  ansible.builtin.slurp:
    src: "{{ github_release_download_version_file }}"
  register: github_release_download_current_version_raw
  when: github_release_download_version_file_stat.stat.exists
  tags: [github_release]

- name: Set current version fact
  ansible.builtin.set_fact:
    github_release_download_current_version: >-
      {{ (github_release_download_current_version_raw.content | b64decode | trim)
         if github_release_download_version_file_stat.stat.exists else '' }}
  tags: [github_release]

- name: Get release info from GitHub API
  ansible.builtin.uri:
    url: >-
      {{ github_release_download_api_url }}/{{ github_release_download_repo }}/releases/{{
        'tags/' + github_release_download_version
        if github_release_download_version is defined
        else 'latest'
      }}
    method: GET
    return_content: true
    headers:
      Accept: "application/vnd.github+json"
      Authorization: >-
        {{ 'Bearer ' + github_release_download_token
           if github_release_download_token is defined else omit }}
  register: github_release_download_release_info
  no_log: "{{ github_release_download_token is defined }}"
  tags: [github_release]

- name: Parse GitHub release response
  ansible.builtin.set_fact:
    github_release_download_release: >-
      {{
        github_release_download_release_info.json
        | default(github_release_download_release_info.content | from_json)
      }}
  tags: [github_release]

- name: Set latest version and download URL facts
  ansible.builtin.set_fact:
    github_release_download_latest_version: "{{ github_release_download_release.tag_name }}"
    github_release_download_url: >-
      {{ github_release_download_release.assets
         | selectattr('name', 'equalto', github_release_download_asset)
         | map(attribute=('url' if github_release_download_token is defined else 'browser_download_url'))
         | first | default('') }}
    github_release_download_checksum_url: >-
      {{ github_release_download_release.assets
         | selectattr('name', 'equalto', github_release_download_checksum_asset | default(''))
         | map(attribute=('url' if github_release_download_token is defined else 'browser_download_url'))
         | first | default('') }}
    github_release_download_asset_digest: >-
      {{ github_release_download_release.assets
         | selectattr('name', 'equalto', github_release_download_asset)
         | map(attribute='digest')
         | first | default('') }}
  tags: [github_release]

- name: Validate release assets
  ansible.builtin.assert:
    that:
      - github_release_download_latest_version | length > 0
      - github_release_download_url | length > 0
      - github_release_download_checksum_asset is not defined or github_release_download_checksum_url | length > 0
    quiet: true
    fail_msg: Requested release asset or checksum asset is missing
  tags: [github_release]

- name: Fetch release checksum manifest
  ansible.builtin.uri:
    url: "{{ github_release_download_checksum_url }}"
    method: GET
    return_content: true
    headers: >-
      {{
        {'Accept': 'application/octet-stream'}
        | combine(
            {'Authorization': 'Bearer ' + github_release_download_token}
            if github_release_download_token is defined else {}
          )
      }}
    unredirected_headers:
      - Authorization
  register: github_release_download_checksum_manifest
  when: github_release_download_checksum_asset is defined
  no_log: "{{ github_release_download_token is defined }}"
  tags: [github_release]

- name: Resolve expected release checksum
  ansible.builtin.set_fact:
    github_release_download_expected_checksum: >-
      {{
        (github_release_download_checksum | regex_replace('^sha256:', ''))
        if github_release_download_checksum is defined
        else (
          github_release_download_checksum_manifest.content
          | regex_findall(
              '(?m)^([a-fA-F0-9]{64})\\s+\\*?'
              ~ (github_release_download_asset | regex_escape)
              ~ '$'
            )
          | first
          | default('')
          if github_release_download_checksum_asset is defined
          else (github_release_download_asset_digest | regex_replace('^sha256:', ''))
        )
      }}
  tags: [github_release]

- name: Validate release checksum
  ansible.builtin.assert:
    that:
      - >-
        github_release_download_allow_unverified or
        github_release_download_expected_checksum is match('^[a-fA-F0-9]{64}$')
    quiet: true
    fail_msg: Release asset has no allowed SHA-256 verification source
  tags: [github_release]

- name: Determine if download is needed
  ansible.builtin.set_fact:
    github_release_download_needs_update: >-
      {{ not github_release_download_file_stat.stat.exists
         or github_release_download_current_version != github_release_download_latest_version
         or (
           github_release_download_expected_checksum | length > 0
           and (github_release_download_file_stat.stat.checksum | default(''))
               != github_release_download_expected_checksum
         ) }}
  tags: [github_release]

- name: Display version information
  ansible.builtin.debug:
    msg: >-
      File exists: {{ github_release_download_file_stat.stat.exists }},
      Current version: {{ github_release_download_current_version | default('none') }},
      Latest version: {{ github_release_download_latest_version }},
      Download needed: {{ github_release_download_needs_update }}
  when: github_release_download_debug | default(false)
  tags: [github_release]

- name: Download file from GitHub release
  ansible.builtin.get_url:
    url: "{{ github_release_download_url }}"
    dest: "{{ github_release_download_dest }}"
    mode: "{{ github_release_download_mode }}"
    owner: "{{ github_release_download_owner | default(omit) }}"
    group: "{{ github_release_download_group | default(omit) }}"
    checksum: >-
      {{ ('sha256:' + github_release_download_expected_checksum)
         if github_release_download_expected_checksum | length > 0
         else omit }}
    force: true
    headers: >-
      {{
        {'Accept': 'application/octet-stream'}
        | combine(
            {'Authorization': 'Bearer ' + github_release_download_token}
            if github_release_download_token is defined else {}
          )
      }}
    unredirected_headers:
      - Authorization
  when: github_release_download_needs_update
  register: github_release_download_fetch_result
  no_log: "{{ github_release_download_token is defined }}"
  tags: [github_release]

- name: Write version file
  ansible.builtin.copy:
    content: "{{ github_release_download_latest_version }}"
    dest: "{{ github_release_download_version_file }}"
    mode: '0644'
  when: github_release_download_needs_update
  tags: [github_release]

- name: Set result facts
  ansible.builtin.set_fact:
    github_release_download_changed: "{{ github_release_download_needs_update }}"
    github_release_download_resolved_version: "{{ github_release_download_latest_version }}"
  tags: [github_release]

# Cron auto-update setup
- name: Setup cron auto-update
  when: github_release_download_cron_enabled | default(false)
  tags: [github_release, cron]
  block:
    - name: Install cron updater dependencies
      ansible.builtin.package:
        name: "{{ github_release_download_cron_packages }}"
        state: present

    - name: Ensure scripts directory exists
      ansible.builtin.file:
        path: "{{ github_release_download_cron_script_dir }}"
        state: directory
        mode: '0755'

    - name: Generate unique script name
      ansible.builtin.set_fact:
        github_release_download_script_name: >-
          github-release-update-{{
            (github_release_download_repo ~ '-' ~ github_release_download_asset)
            | regex_replace('[^a-zA-Z0-9]', '-')
          }}.sh

    - name: Ensure cron updater token directory exists
      ansible.builtin.file:
        path: "{{ github_release_download_token_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: github_release_download_token is defined

    - name: Store GitHub API token for the cron updater
      ansible.builtin.copy:
        content: "{{ github_release_download_token }}\n"
        dest: "{{ github_release_download_token_file }}"
        owner: root
        group: root
        mode: "0600"
      when: github_release_download_token is defined
      no_log: true

    - name: Remove an obsolete cron updater token file
      ansible.builtin.file:
        path: "{{ github_release_download_token_file }}"
        state: absent
      when: github_release_download_token is not defined

    - name: Deploy auto-update script
      ansible.builtin.template:
        src: update-script.sh.j2
        dest: "{{ github_release_download_cron_script_dir }}/{{ github_release_download_script_name }}"
        owner: root
        group: root
        mode: "0700"

    - name: Remove obsolete asset-only updater script
      ansible.builtin.file:
        path: >-
          {{ github_release_download_cron_script_dir }}/github-release-update-{{
            github_release_download_asset | regex_replace('[^a-zA-Z0-9]', '-')
          }}.sh
        state: absent

    - name: Remove obsolete asset-only cron job
      ansible.builtin.cron:
        name: "GitHub release auto-update: {{ github_release_download_asset }}"
        user: "{{ github_release_download_cron_user }}"
        state: absent

    - name: Setup cron job for auto-update
      ansible.builtin.cron:
        name: >-
          GitHub release auto-update: {{ github_release_download_repo }}/{{ github_release_download_asset }}
        minute: "{{ github_release_download_cron_minute }}"
        hour: "{{ github_release_download_cron_hour }}"
        day: "{{ github_release_download_cron_day }}"
        weekday: "{{ github_release_download_cron_weekday }}"
        month: "{{ github_release_download_cron_month }}"
        job: "{{ github_release_download_cron_script_dir }}/{{ github_release_download_script_name }}"
        user: "{{ github_release_download_cron_user }}"
        state: present
