---
- name: Create PVE maintenance helper directory
  ansible.builtin.file:
    path: /usr/local/lib/pve-maintenance
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install PVE maintenance check helper
  ansible.builtin.template:
    src: pve-maintenance-check.j2
    dest: /usr/local/lib/pve-maintenance/pve-maintenance-check
    owner: root
    group: root
    mode: "0700"
