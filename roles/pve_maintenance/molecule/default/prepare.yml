---
- name: Prepare PVE maintenance command mocks
  hosts: all
  tasks:
    - name: Create fake pmxcfs tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /etc/pve/priv
        - /run/pve-maintenance-test

    - name: Create fake corosync configuration
      ansible.builtin.copy:
        content: |
          quorum {
            two_node: 1
          }
        dest: /etc/pve/corosync.conf
        owner: root
        group: root
        mode: "0600"

    - name: Install PVE maintenance mock commands
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          set -euo pipefail
          command=$(basename "$0")
          case "$command" in
              findmnt)
                  if [[ -e /run/pve-maintenance-test/bad-pmxcfs ]]; then
                      printf '%s\n' '/etc/pve /dev/sda1 ext4'
                  else
                      printf '%s\n' '/etc/pve /dev/fuse fuse'
                  fi
                  ;;
              hostname)
                  if [[ -e /run/pve-maintenance-test/hostname-mismatch ]]; then
                      printf '%s\n' europa
                  else
                      printf '%s\n' io
                  fi
                  ;;
              pvecm)
                  if [[ -e /run/pve-maintenance-test/no-quorum ]]; then
                      printf '%s\n' 'Name: jupiter' 'Nodes: 2' 'Expected votes: 2' 'Total votes: 2' 'Quorate: No'
                  else
                      printf '%s\n' 'Name: jupiter' 'Nodes: 2' 'Expected votes: 2' 'Total votes: 2' 'Quorate: Yes'
                  fi
                  ;;
              pvesh)
                  if [[ "$*" == *'/cluster/status'* ]]; then
                      if [[ -e /run/pve-maintenance-test/missing-peer ]]; then
                          printf '%s\n' '[{"type":"node","name":"io","online":1}]'
                      else
                          printf '%s\n' \
                              '[{"type":"node","name":"io","online":1},' \
                              '{"type":"node","name":"europa","online":1}]'
                      fi
                  elif [[ "$*" == *'/cluster/tasks'* ]]; then
                      if [[ -e /run/pve-maintenance-test/active-task ]]; then
                          printf '%s\n' '[{"status":"OK","upid":"UPID:active"}]'
                      else
                          printf '%s\n' '[{"type":"vncproxy","status":"running","endtime":1}]'
                      fi
                  elif [[ "$*" == *'/replication'* ]]; then
                      if [[ -e /run/pve-maintenance-test/replication-error ]]; then
                          printf '%s\n' '[{"fail_count":1,"last_sync":1,"last_try":1,"next_sync":2}]'
                      elif [[ -e /run/pve-maintenance-test/replication-running ]]; then
                          printf '%s\n' '[{"fail_count":0,"status":"running"}]'
                      else
                          printf '%s\n' \
                              '[{"fail_count":0,"last_sync":1,"last_try":1,"next_sync":2}]'
                      fi
                  else
                      exit 2
                  fi
                  ;;
              pct)
                  if [[ "$1" == status ]]; then
                      if [[ -e /run/pve-maintenance-test/ct-down ]]; then
                          printf '%s\n' 'status: stopped'
                      else
                          printf '%s\n' 'status: running'
                      fi
                  elif [[ "$1" == exec ]] && \
                      [[ -e /run/pve-maintenance-test/pbs-task ]]; then
                      printf '%s\n' '[{"status":"running"}]'
                  else
                      printf '%s\n' '[]'
                  fi
                  ;;
              systemctl)
                  printf '%s\n' "$*" >>/run/pve-maintenance-test/systemctl-arguments
                  if [[ "$1" == is-active ]]; then
                      if [[ -e /run/pve-maintenance-test/apt-service-active ]] && \
                          [[ "${@: -1}" == apt-daily.service ]]; then
                          exit 0
                      fi
                      case "${@: -1}" in
                          pve-cluster.service|corosync.service|pvedaemon.service|pveproxy.service|pvestatd.service)
                              [[ -e /run/pve-maintenance-test/required-service-down ]] && exit 3
                              exit 0
                              ;;
                           *) exit 3 ;;
                       esac
                  elif [[ "$1" == is-enabled ]]; then
                      if [[ "${@: -1}" == apt-daily-upgrade.timer ]]; then
                          if [[ -e /run/pve-maintenance-test/install-timer-enabled ]]; then
                              printf '%s\n' enabled
                              exit 0
                          fi
                          printf '%s\n' disabled
                          exit 1
                      fi
                      exit 2
                  elif [[ "$1" == show ]]; then
                      case "$*" in
                          *ExecMainExitTimestamp*)
                              if [[ -e /run/pve-maintenance-test/stale-backup ]]; then
                                  date --date='4 days ago' --iso-8601=seconds
                              else
                                  date --iso-8601=seconds
                              fi
                              ;;
                          *ExecMainStatus*)
                              [[ -e /run/pve-maintenance-test/failed-backup ]] \
                                  && printf '%s\n' 1 || printf '%s\n' 0
                              ;;
                          *Result*)
                              [[ -e /run/pve-maintenance-test/failed-backup ]] \
                                  && printf '%s\n' failed || printf '%s\n' success
                              ;;
                          *ActiveState*) printf '%s\n' inactive ;;
                          *) exit 2 ;;
                      esac
                  elif [[ "$1" == --failed ]]; then
                      :
                  fi
                  ;;
              pgrep)
                  [[ -e /run/pve-maintenance-test/apt-process-active ]] && exit 0
                  exec /usr/bin/pgrep "$@"
                  ;;
              apt-config)
                  if [[ -e /run/pve-maintenance-test/package-download-enabled ]]; then
                      printf '%s\n' 'APT::Periodic::Download-Upgradeable-Packages "1";'
                  else
                      printf '%s\n' \
                          'APT::Periodic::Update-Package-Lists "1";' \
                          'APT::Periodic::Download-Upgradeable-Packages "0";' \
                          'APT::Periodic::AutocleanInterval "0";'
                  fi
                  ;;
              dpkg)
                  if [[ "${1:-}" == --audit ]]; then
                      if [[ -e /run/pve-maintenance-test/dpkg-audit ]]; then
                          printf '%s\n' 'The following packages are only half configured'
                      fi
                      exit 0
                  fi
                  if [[ "${1:-}" == --compare-versions ]]; then
                      exec /usr/bin/dpkg "$@"
                  fi
                  ;;
              dpkg-query)
                  if [[ "$*" == *'proxmox-kernel-'* ]]; then
                      printf '%b\n' 'proxmox-kernel-6.14.0-1-pve-signed\t6.14.0-1\tinstalled'
                  elif [[ "$*" == *'proxmox-ve'* && "$*" != *'showformat'* ]]; then
                      printf '%s\n' 'proxmox-ve'
                  else
                      printf '%s\n' installed
                  fi
                  ;;
              apt-mark)
                  :
                  ;;
              proxmox-boot-tool|pveversion)
                  printf '%s\n' "mock $command"
                  ;;
              df)
                  printf '%s\n' \
                      'Filesystem 1024-blocks Used Available Capacity Mounted on' \
                      '/dev/mock 99999 1 99999 1% /'
                  ;;
              uname)
                  printf '%s\n' '6.14.0-0-pve'
                  ;;
              apt-get)
                  printf '%s\n' "$*" >>/run/pve-maintenance-test/apt-arguments
                  if [[ -e /run/pve-maintenance-test/upgrade-failure ]] && [[ " $* " == *' -y '* ]]; then
                      touch /var/run/reboot-required
                      exit 1
                  fi
                  if [[ -e /run/pve-maintenance-test/protected-removal ]] && [[ "$*" == *' -s '* ]]; then
                      printf '%s\n' 'Remv pve-manager [9.0]'
                  elif [[ -e /run/pve-maintenance-test/kernel-removal ]] && [[ "$*" == *' -s '* ]]; then
                      printf '%s\n' 'Remv proxmox-kernel-6.14.0-0-pve-signed [6.14.0-0]'
                  else
                      printf '%s\n' "mock apt-get $*"
                  fi
                  if [[ -e /run/pve-maintenance-test/service-fails-after-simulation ]] && \
                      [[ "$*" == *' -s '* ]]; then
                      touch /run/pve-maintenance-test/required-service-down
                  fi
                  ;;
              *)
                  printf '%s\n' "unexpected mock: $command $*" >&2
                  exit 2
                  ;;
          esac
        dest: "/usr/local/bin/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - apt-config
        - apt-get
        - apt-mark
        - df
        - dpkg
        - dpkg-query
        - findmnt
        - hostname
        - pct
        - pgrep
        - proxmox-boot-tool
        - pvecm
        - pvesh
        - pveversion
        - systemctl
        - uname

    - name: Create APT process regression fixture directory
      ansible.builtin.file:
        path: /usr/local/lib/molecule-apt-fixtures
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install named APT process regression fixtures
      ansible.builtin.copy:
        src: /bin/sleep
        dest: "/usr/local/lib/molecule-apt-fixtures/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      loop:
        - apt
        - apt-get
        - dpkg

    - name: Install APT process regression fixture units
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Molecule {{ item.name }} APT process regression fixture

          [Service]
          Type=simple
          ExecStart={{ item.command }}
        dest: "/etc/systemd/system/molecule-{{ item.name }}.service"
        owner: root
        group: root
        mode: "0644"
      loop:
        - name: harmless-apt-argument
          command: >-
            /bin/bash -c 'sleep 300 & wait' harmless /var/lib/apt
        - name: apt-transaction
          command: /usr/local/lib/molecule-apt-fixtures/apt 300
        - name: apt-get-transaction
          command: /usr/local/lib/molecule-apt-fixtures/apt-get 300
        - name: dpkg-transaction
          command: /usr/local/lib/molecule-apt-fixtures/dpkg 300
        - name: apt-systemd-daily
          command: >-
            /bin/bash -c 'exec -a /usr/lib/apt/apt.systemd.daily /bin/sleep 300'

    - name: Reload APT process regression fixture units
      ansible.builtin.systemd_service:
        daemon_reload: true
