---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: io
    image: geerlingguy/docker-debian12-ansible@sha256:a906d69671f93666731d196add52a2447966303d8bc398da8fd01bdb543909dc
    pre_build_image: true
    pull: true
    privileged: true
    cgroupns_mode: host
    command: >-
      /bin/sh -c 'if ! mountpoint -q /proc/sys/fs/binfmt_misc; then
      mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc; fi &&
      mount --bind /proc/sys/fs/binfmt_misc/status
      /proc/sys/fs/binfmt_misc/status &&
      mount -o remount,bind,ro /proc/sys/fs/binfmt_misc/status &&
      exec /lib/systemd/systemd'
    groups:
      - pve
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  inventory:
    group_vars:
      pve:
        pve_maintenance_apt_timeout: 60
        pve_maintenance_root_free_mb: 1024
        pve_maintenance_boot_free_mb: 256
        pve_maintenance_host_backup_max_age_hours: 72
verifier:
  name: ansible
