---
- name: Create failure fixture for {{ pve_maintenance_failure_case.name }}
  ansible.builtin.file:
    path: "{{ pve_maintenance_failure_case.path }}"
    state: touch
    mode: "0600"

- name: Run preflight failure for {{ pve_maintenance_failure_case.name }}
  ansible.builtin.command:
    argv:
      - /usr/local/lib/pve-maintenance/pve-maintenance-check
      - preflight
      - --node
      - io
      - --cluster-name
      - jupiter
      - --cluster-nodes
      - europa,io
      - --root-free-mb
      - "1024"
      - --boot-free-mb
      - "256"
      - --host-backup-max-age-hours
      - "72"
  register: pve_maintenance_failure_result
  changed_when: false
  failed_when: false

- name: Remove failure fixture for {{ pve_maintenance_failure_case.name }}
  ansible.builtin.file:
    path: "{{ pve_maintenance_failure_case.path }}"
    state: absent

- name: Confirm preflight failure blocks {{ pve_maintenance_failure_case.name }}
  ansible.builtin.assert:
    that:
      - pve_maintenance_failure_result.rc != 0
